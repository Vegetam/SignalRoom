# Standalone coturn for TURN validation and custom WebRTC experiments.
# LiveKit selects its own ICE topology; this coturn instance is NOT automatically
# advertised to LiveKit SDK peers. See README for production TURN configuration.
listening-port=3478
fingerprint
lt-cred-mech
realm=meet.local
min-port=49160
max-port=49170
no-cli
no-loopback-peers
no-multicast-peers
# Local-only template: supply external-ip / TLS credentials for real deployments.
